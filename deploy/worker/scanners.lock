# Scanner executables for the worker. fetch-scanners.sh reads this file.
#
# One line per tool and platform:
#   <tool> <version> <os> <arch> <sha256> <url>
# os and arch use Go's names (GOOS, GOARCH). sha256 is the checksum of the
# file at url: for betterleaks the release archive, as listed in the release's
# checksums.txt; for opengrep the executable itself, as the release lists it as
# the asset digest (opengrep publishes no checksum file).
#
# To change a version, replace every line of that tool and take each checksum
# from the release page, never from a local download.

