version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - testpackage
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G204
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      static-msg: true
      key-naming-case: snake
  exclusions:
    paths:
      - (^|/)testdata/
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
    goimports:
      local-prefixes:
        - github.com/SH-Hong1/secret-externalizer
  exclusions:
    paths:
      - (^|/)testdata/
