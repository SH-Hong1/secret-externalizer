name: 작업(task)
description: PR 하나로 끝나는 작업. 기능 이슈의 하위 이슈로 만든다.
body:
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      description: 이 작업에서 만드는 것. PR 하나보다 크면 나눈다.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇으로 끝났다고 판단하는가.
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: 상위 기능
      description: 이 작업이 속한 기능 이슈 번호. 만든 뒤 하위 이슈로 연결한다.
      placeholder: "#12"
