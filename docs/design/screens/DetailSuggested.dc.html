<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상세, 과거 판정 제안</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#1F4FD8}a:hover{color:#163A9E}
</style>
</helmet>
<div style="width: 760px; height: 600px; box-sizing: border-box; padding: 20px 24px 24px; background: #FFFFFF; color: #15171C; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">비밀번호</h2>
<span style="color: #565D6B">ssh 접속 정보</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; padding: 3px 8px; background: #F3F4F6; border: 1px solid #D9DDE3; border-radius: 4px">dp!2****</span>
<span style="flex-grow: 1"></span>
<span style="padding: 3px 10px; border: 1px solid #15171C; border-radius: 999px; font-size: 12.5px; font-weight: 600">미판정</span>
</div>

<div style="border: 1px solid #D9DDE3; border-radius: 6px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 12px; background: #F7F8FA; border-bottom: 1px solid #D9DDE3">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600">deploy/release.sh:8</span>
<span style="flex-grow: 1"></span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #565D6B">opengrep shell-sshpass-password</span>
</div>
<pre style="margin: 0; padding: 8px 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.6; overflow-x: auto"><span style="display: block; padding: 0 12px"><span style="color: #6B7280"> 7  </span># 운영 서버에 배포</span><span style="display: block; padding: 0 12px; background: #FFF1CC; box-shadow: inset 3px 0 0 #C27A00"><span style="color: #6B7280"> 8  </span>sshpass -p '<strong>dp!2****</strong>' scp app.war ****@****:/srv/app</span><span style="display: block; padding: 0 12px"><span style="color: #6B7280"> 9  </span>echo "done"</span></pre>
</div>

<p style="margin: 0; padding: 12px 14px; background: #E6ECFC; border: 1px solid #A9BDF3; border-radius: 6px; color: #12307F"><strong>제안: 외부화.</strong> 같은 값을 프로젝트 billing에서 2026-11-12에 외부화로 판정했습니다. 버튼을 눌러야 저장됩니다.</p>

<form style="display: flex; flex-direction: column; gap: 14px; padding: 16px; background: #F7F8FA; border: 1px solid #D9DDE3; border-radius: 6px">
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 520px">
<label for="name" style="font-weight: 600">placeholder 이름 <span style="font-weight: 400; color: #565D6B">· 제안</span></label>
<div style="display: flex; align-items: stretch; border: 1px solid #B9BFC9; border-radius: 6px; background: #FFFFFF; overflow: hidden">
<span style="display: flex; align-items: center; padding: 0 8px 0 10px; font-family: 'IBM Plex Mono', monospace; color: #565D6B; background: #EEF0F3; border-right: 1px solid #D9DDE3">EXT_</span>
<input id="name" value="ssh.main.password" style="flex-grow: 1; min-width: 0; font-family: 'IBM Plex Mono', monospace; font-size: 14px; padding: 9px 10px; min-height: 22px; border: 0; background: transparent; color: #15171C">
</div>
<span style="font-size: 12.5px; color: #565D6B">shell에는 <span style="font-family: 'IBM Plex Mono', monospace; color: #15171C">${EXT_SSH_MAIN_PASSWORD}</span> 로 들어갑니다.</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button type="button" style="font: inherit; font-weight: 600; background: #1F4FD8; color: #FFFFFF; border: 1px solid #1F4FD8; border-radius: 6px; padding: 10px 18px; min-height: 44px; cursor: pointer; box-shadow: 0 0 0 3px #A9BDF3">외부화 · 제안</button>
<button type="button" style="font: inherit; font-weight: 600; background: #FFFFFF; color: #3D4350; border: 1px solid #3D4350; border-radius: 6px; padding: 10px 18px; min-height: 44px; cursor: pointer">오탐</button>
<span style="width: 1px; align-self: stretch; background: #D9DDE3"></span>
<label for="reason" style="color: #565D6B">보류 사유</label>
<select id="reason" style="font: inherit; padding: 9px 10px; min-height: 44px; border: 1px solid #B9BFC9; border-radius: 6px; background: #FFFFFF; color: #15171C">
<option>확인 필요</option><option>구조 변경 필요</option><option>나중에 처리</option>
</select>
<button type="button" style="font: inherit; font-weight: 600; background: #FFFFFF; color: #8A4300; border: 1px solid #8A4300; border-radius: 6px; padding: 10px 18px; min-height: 44px; cursor: pointer">보류</button>
</div>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":600}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
