# Settings that a comment keeps: a data source bean commented out in a Spring
# XML context, commented-out lines of .properties and application*.yml
# files, and commented-out Java code. A legacy project often keeps an old production connection this way,
# and the value stays in the repository even though the program does not
# read it. Every rule reports only the value, never the quotes or the key,
# and a value that is a ${...} or #{...} placeholder or empty is not
# reported. The rules that read the same settings outside a comment are in
# spring.yml; the XML ones there read the parsed document, in which a
# comment holds no elements.
#
# A rule's patterns are regular expressions that all have to match, so a
# value is reported only where its property lies inside an XML comment (and,
# for a URL or a user name, inside a data source bean as well), or where its
# Java statement lies inside a Java comment.
#
# Every rule starts with "  - id:" and has its category and kind under
# metadata, which the rule tests read line by line.
rules:
  # A data source bean is one whose id or class contains datasource, jdbc,
  # hikari, c3p0, dbcp, druid, bonecp, or proxool, as in spring.yml. Its URL
  # is a <property name="url" value="..."/> (or URL, jdbcUrl, driverUrl) in
  # the bean's body, or a p:url or p:jdbcUrl attribute on the bean. A value
  # may be in double or single quotes.
  - id: spring-xml-comment-datasource-url
    message: A data source URL is written in a commented-out Spring XML bean.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.xml"]
    metadata:
      category: storage-credential
      kind: url
    patterns:
      - pattern-regex: (?s)<!--.*?-->
      - pattern-either:
          - patterns:
              - pattern-regex: (?s)<bean\b(?=[^>]*\b(?:id|class)\s*=\s*["'][^"']*(?i:datasource|jdbc|hikari|c3p0|dbcp|druid|bonecp|proxool))[^>]*>.*?</bean>
              - pattern-regex: <property\s+name\s*=\s*["'](?:url|URL|jdbcUrl|driverUrl)["']\s+value\s*=\s*(?|"(?![$#]\{)(?P<VALUE>[^"\s][^"]*)"|'(?![$#]\{)([^'\s][^']*)')
          - pattern-regex: <bean\b(?=[^>]*\b(?:id|class)\s*=\s*["'][^"']*(?i:datasource|jdbc|hikari|c3p0|dbcp|druid|bonecp|proxool))[^>]*?\sp:(?:url|jdbcUrl)\s*=\s*(?|"(?![$#]\{)(?P<VALUE>[^"\s][^"]*)"|'(?![$#]\{)([^'\s][^']*)')
      - focus-metavariable: $VALUE

  - id: spring-xml-comment-datasource-username
    message: A data source user name is written in a commented-out Spring XML bean.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.xml"]
    metadata:
      category: storage-credential
      kind: account
    patterns:
      - pattern-regex: (?s)<!--.*?-->
      - pattern-either:
          - patterns:
              - pattern-regex: (?s)<bean\b(?=[^>]*\b(?:id|class)\s*=\s*["'][^"']*(?i:datasource|jdbc|hikari|c3p0|dbcp|druid|bonecp|proxool))[^>]*>.*?</bean>
              - pattern-regex: <property\s+name\s*=\s*["'](?:username|user)["']\s+value\s*=\s*(?|"(?![$#]\{)(?P<VALUE>[^"\s][^"]*)"|'(?![$#]\{)([^'\s][^']*)')
          - pattern-regex: <bean\b(?=[^>]*\b(?:id|class)\s*=\s*["'][^"']*(?i:datasource|jdbc|hikari|c3p0|dbcp|druid|bonecp|proxool))[^>]*?\sp:(?:username|user)\s*=\s*(?|"(?![$#]\{)(?P<VALUE>[^"\s][^"]*)"|'(?![$#]\{)([^'\s][^']*)')
      - focus-metavariable: $VALUE

  # A password in a comment, whatever bean it belongs to, as in spring.yml: a
  # property or a constructor argument whose name ends in password or passwd
  # in any case, given as an attribute or a <value> child, or a p: attribute
  # whose name ends the same way (p:password, p:dbPassword).
  - id: spring-xml-comment-password
    message: A password is written in a commented-out Spring XML element.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.xml"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-regex: (?s)<!--.*?-->
      - pattern-either:
          - pattern-regex: <(?:property|constructor-arg)\s+name\s*=\s*["'](?i:[\w.-]*passw(?:or)?d)["']\s+value\s*=\s*(?|"(?![$#]\{)(?P<VALUE>[^"\s][^"]*)"|'(?![$#]\{)([^'\s][^']*)')
          - pattern-regex: <(?:property|constructor-arg)\s+name\s*=\s*["'](?i:[\w.-]*passw(?:or)?d)["']\s*>\s*<value>(?![$#]\{)(?P<VALUE>[^<\s](?:[^<]*[^<\s])?)\s*</value>
          - patterns:
              - pattern-regex: <bean\b(?:[^>"']|"[^"]*"|'[^']*')*>
              - pattern-regex: \sp:(?i:[\w.-]*passw(?:or)?d)\s*=\s*(?|"(?![$#]\{)(?P<VALUE>[^"\s][^"]*)"|'(?![$#]\{)([^'\s][^']*)')
      - focus-metavariable: $VALUE

  # Comment lines of .properties files that hold a key and a value in the
  # shape the properties rules in spring.yml report: the line starts with #
  # or !, then the key, then = or :, then the value. White space alone does
  # not separate them here, and the value is one word that ends the line, so
  # a sentence such as "# password must be rotated" or "# password: see the
  # wiki" is not a setting. A password value that holds Hangul is a
  # message, as in properties-password.
  - id: properties-comment-password
    message: A password is written in a commented-out line of a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-regex: (?mi)^[ \t]*[#!][#! \t]*(?:[\w-]+\.)*(?:[\w-]*(?:password|passwd|pwd)|(?:[\w-]*[_-])?pass)[ \t]*[=:][ \t]*(?![$#]\{)(?![^\r\n]*(?:\p{Hangul}|\\u(?:[aAbBcC][0-9a-fA-F]{3}|[dD][0-7][0-9a-fA-F]{2}|11[0-9a-fA-F]{2}|31[3-8][0-9a-fA-F])))(?P<VALUE>\S+)[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: properties-comment-username
    message: A user name is written in a commented-out line of a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: account
    patterns:
      - pattern-regex: (?mi)^[ \t]*[#!][#! \t]*(?:[\w-]+\.)*(?:username|user|userid)[ \t]*[=:][ \t]*(?![$#]\{)(?P<VALUE>\S+)[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: properties-comment-jdbc-url
    message: A JDBC URL is written in a commented-out line of a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: url
    patterns:
      - pattern-regex: (?mi)^[ \t]*[#!][#! \t]*[\w.-]*url[ \t]*[=:][ \t]*(?P<VALUE>jdbc:\S+)
      - focus-metavariable: $VALUE

  - id: properties-comment-host
    message: A host name is written in a commented-out line of a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: host
    patterns:
      - pattern-regex: (?mi)^[ \t]*[#!][#! \t]*(?:[\w-]+\.)*(?:host|hostname)[ \t]*[=:][ \t]*(?![$#]\{)(?P<VALUE>\S+)[ \t]*\r?$
      - focus-metavariable: $VALUE

  # Comment lines of application*.yml files that hold a key: value line in
  # the shape the YAML rules in spring.yml report. The value may be quoted
  # and is one word that ends the line, so "# password is read from the
  # vault" is not a setting.
  - id: yaml-comment-password
    message: A password is written in a commented-out line of a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-regex: (?mi)^[ \t]*#[# \t]*(?:-[ \t]+)?(?:[\w-]+\.)*(?:[\w-]*(?:password|passwd|pwd)|(?:[\w-]*[_-])?pass)[ \t]*:[ \t]+(?|"(?![$#]\{)(?P<VALUE>[^"\s]+)"|'(?![$#]\{)([^'\s]+)'|(?![$#]\{)([^\s"'#>|]\S*))[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: yaml-comment-username
    message: A user name is written in a commented-out line of a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: account
    patterns:
      - pattern-regex: (?mi)^[ \t]*#[# \t]*(?:-[ \t]+)?(?:[\w-]+\.)*(?:username|user|userid)[ \t]*:[ \t]+(?|"(?![$#]\{)(?P<VALUE>[^"\s]+)"|'(?![$#]\{)([^'\s]+)'|(?![$#]\{)([^\s"'#>|]\S*))[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: yaml-comment-jdbc-url
    message: A JDBC URL is written in a commented-out line of a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: url
    patterns:
      - pattern-regex: (?mi)^[ \t]*#[# \t]*(?:-[ \t]+)?[\w.-]*url[ \t]*:[ \t]+["']?(?P<VALUE>jdbc:[^\s"']+)
      - focus-metavariable: $VALUE

  - id: yaml-comment-host
    message: A host name is written in a commented-out line of a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: host
    patterns:
      - pattern-regex: (?mi)^[ \t]*#[# \t]*(?:-[ \t]+)?(?:[\w-]+\.)*(?:host|hostname)[ \t]*:[ \t]+(?|"(?![$#]\{)(?P<VALUE>[^"\s]+)"|'(?![$#]\{)([^'\s]+)'|(?![$#]\{)([^\s"'#>|]\S*))[ \t]*\r?$
      - focus-metavariable: $VALUE

  # Commented-out Java code reported as java.yml reports the same code
  # outside a comment. A Java comment here is a // comment or a /* ... */
  # block (Javadoc included) whose opening marker is the first thing on its
  # line. A marker after code on the same line is not taken as a comment,
  # because "//" and "/*" also occur inside string literals such as
  # "http://..." and "/api/**", and the code around them is read by java.yml
  # already. A literal is a double-quoted string on one line, which may hold
  # backslash escapes, and is not empty.
  #
  # A literal assigned to a variable or field, with or without a type or a
  # qualifier such as this., when the name is one java-secret-variable
  # reports: the name rules there are repeated here as lookaheads on the
  # last identifier before the =.
  - id: java-comment-secret-variable
    message: A string literal is assigned to a variable whose name says it holds a secret, in commented-out Java code.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.java"]
    metadata:
      category: other-secret
      kind: password
    patterns:
      - pattern-regex: (?m)^[ \t]*(?://.*|/\*(?s:.*?)\*/)
      - pattern-regex: (?<![\w$.])(?:[\w$]+\.)*(?=(?:[\w$]*(?i:passw|secret|token|pwd)|[\w$]*[a-z0-9_](?:Pass|PASS|Pw|PW)(?![\w$])|(?i:pass|pw)(?![\w$])))(?![\w$]*(?i:header|name|field|param|parameter|attr|attribute|label|prefix|suffix|type|url|uri|path|pattern|format)(?![\w$]))(?!(?:MSG|MESSAGE|ERR|ERROR|LABEL|TITLE|TEXT)_)(?!(?:msg|message|err|error|label|title|text)[A-Z])[A-Za-z_$][\w$]*[ \t]*=[ \t]*"(?P<VALUE>(?:[^"\\\r\n]|\\.)+)"[ \t]*;
      - focus-metavariable: $VALUE

  # A literal passed to setPassword, as java-set-password reports.
  - id: java-comment-set-password
    message: A string literal is passed to setPassword in commented-out Java code.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.java"]
    metadata:
      category: other-secret
      kind: password
    patterns:
      - pattern-regex: (?m)^[ \t]*(?://.*|/\*(?s:.*?)\*/)
      - pattern-regex: \.[ \t]*setPassword[ \t]*\([ \t]*"(?P<VALUE>(?:[^"\\\r\n]|\\.)+)"[ \t]*\)
      - focus-metavariable: $VALUE

  # A literal set as a property whose key contains passw or pwd, as
  # java-set-property-password reports.
  - id: java-comment-set-property-password
    message: A string literal is set as a password property in commented-out Java code.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.java"]
    metadata:
      category: other-secret
      kind: password
    patterns:
      - pattern-regex: (?m)^[ \t]*(?://.*|/\*(?s:.*?)\*/)
      - pattern-regex: \.[ \t]*setProperty[ \t]*\([ \t]*"(?i:[^"\\\r\n]*(?:passw|pwd)[^"\\\r\n]*)"[ \t]*,[ \t]*"(?P<VALUE>(?:[^"\\\r\n]|\\.)+)"[ \t]*\)
      - focus-metavariable: $VALUE

  # A literal passed as the third argument of getConnection, as
  # java-get-connection-password reports. The first two arguments are each a
  # string literal, or code without commas, quotes, or nested calls beyond
  # one level of parentheses.
  - id: java-comment-get-connection-password
    message: A string literal is passed as the password to getConnection in commented-out Java code.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.java"]
    metadata:
      category: other-secret
      kind: password
    patterns:
      - pattern-regex: (?m)^[ \t]*(?://.*|/\*(?s:.*?)\*/)
      - pattern-regex: (?<![\w$])getConnection[ \t]*\((?:[ \t]*(?:"(?:[^"\\\r\n]|\\.)*"|(?:[^,()"\r\n]|\([^()"\r\n]*\))+)[ \t]*,){2}[ \t]*"(?P<VALUE>(?:[^"\\\r\n]|\\.)+)"[ \t]*\)
      - focus-metavariable: $VALUE
