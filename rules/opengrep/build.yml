# Passwords in build and deployment settings: a <password> and the
# <username> beside it inside a <server> or a <proxy> in Maven settings.xml,
# an element whose name contains passw in pom.xml, and
# a password property or task attribute in an Ant build.xml. An Ant password
# that signs in to another server, the password of a remote task such as
# <scp> or of a property named after one, is an SSH credential. ${...} and
# #{...} placeholders and empty values are not reported.
#
# Every rule starts with "  - id:" and has its category and kind under
# metadata, which the rule tests read line by line.
rules:
  - id: maven-settings-server-password
    message: A repository password is written in Maven settings.xml.
    severity: WARNING
    languages: [xml]
    paths:
      include: ["settings.xml"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-inside: <server>...</server>
      - pattern: <password>$VALUE</password>
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?![$#]\{)\S
      - focus-metavariable: $VALUE

  - id: maven-settings-server-username
    message: A repository user name is written in Maven settings.xml.
    severity: WARNING
    languages: [xml]
    paths:
      include: ["settings.xml"]
    metadata:
      category: storage-credential
      kind: account
    patterns:
      - pattern-inside: <server>...</server>
      - pattern: <username>$VALUE</username>
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?![$#]\{)\S
      - focus-metavariable: $VALUE

  # A proxy account lets a build reach the network through the proxy; it
  # gives no access to a repository or a server, so it is an other secret.
  - id: maven-settings-proxy-password
    message: A proxy password is written in Maven settings.xml.
    severity: WARNING
    languages: [xml]
    paths:
      include: ["settings.xml"]
    metadata:
      category: other-secret
      kind: password
    patterns:
      - pattern-inside: <proxy>...</proxy>
      - pattern: <password>$VALUE</password>
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?![$#]\{)\S
      - focus-metavariable: $VALUE

  - id: maven-settings-proxy-username
    message: A proxy user name is written in Maven settings.xml.
    severity: WARNING
    languages: [xml]
    paths:
      include: ["settings.xml"]
    metadata:
      category: other-secret
      kind: account
    patterns:
      - pattern-inside: <proxy>...</proxy>
      - pattern: <username>$VALUE</username>
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?![$#]\{)\S
      - focus-metavariable: $VALUE

  - id: maven-pom-password
    message: A password is written in pom.xml.
    severity: WARNING
    languages: [xml]
    paths:
      include: ["pom.xml"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern: <$TAG>$VALUE</$TAG>
      - metavariable-regex:
          metavariable: $TAG
          regex: (?i).*passw
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?![$#]\{)\S
      - focus-metavariable: $VALUE

  - id: ant-property-password
    message: A password property is written in an Ant build.xml.
    severity: WARNING
    languages: [xml]
    paths:
      include: ["build.xml"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern: <property name="$NAME" value="$VALUE"/>
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^(?!.*(?:ssh|scp|ftp|deploy|remote)).*passw(or)?d$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?![$#]\{)\S
      - focus-metavariable: $VALUE

  # A password property named after a remote task, such as deploy.password.
  - id: ant-remote-property-password
    message: A password for another server is written in an Ant build.xml.
    severity: WARNING
    languages: [xml]
    paths:
      include: ["build.xml"]
    metadata:
      category: ssh-credential
      kind: password
    patterns:
      - pattern: <property name="$NAME" value="$VALUE"/>
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^(?=.*(?:ssh|scp|ftp|deploy|remote)).*passw(or)?d$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?![$#]\{)\S
      - focus-metavariable: $VALUE

  # A password attribute of any task that is not a remote one, such as
  # <sql password="...">.
  - id: ant-task-password
    message: A password is passed to an Ant task.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["build.xml"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-regex: (?<![\w.-])(?:password|passwd|storepass|keypass)[ \t]*=[ \t]*"(?![$#]\{)(?P<VALUE>[^"\r\n]+)"
      - pattern-not-regex: <(?:scp|sshexec|sshsession|ftp|telnet|rexec)\b[^<>]*>
      - focus-metavariable: $VALUE

  # A password or passphrase attribute of a task that signs in to another
  # server, such as <scp password="...">.
  - id: ant-remote-task-password
    message: A password for another server is passed to an Ant task.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["build.xml"]
    metadata:
      category: ssh-credential
      kind: password
    patterns:
      - pattern-regex: <(?:scp|sshexec|sshsession|ftp|telnet|rexec)\b[^<>]*>
      - pattern-regex: (?<![\w.-])(?:password|passwd|passphrase)[ \t]*=[ \t]*"(?![$#]\{)(?P<VALUE>[^"\r\n]+)"
      - focus-metavariable: $VALUE
