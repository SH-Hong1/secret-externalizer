# Database settings and passwords in Spring XML contexts, .properties files, and
# application*.yml files. Every rule reports only the value: no quotes, no key
# name, no surrounding XML. Values that are a ${...} or #{...} placeholder or
# empty are not reported.
#
# Every rule starts with "  - id:" and has its category and kind under
# metadata, which the rule tests read line by line.
rules:
  # Connection settings of a connection pool or data source bean: a bean
  # whose id or class contains datasource, jdbc, hikari, c3p0, dbcp, druid,
  # bonecp, or proxool (BasicDataSource, HikariConfig, ComboPooledDataSource,
  # ...). The URL and the user name are credentials only there; a mail
  # sender's username or a thread pool's url is not reported. A value is a <property name="..." value="..."/> or a
  # p: namespace attribute on the bean.
  - id: spring-xml-datasource-url
    message: A data source URL is written in a Spring XML context.
    severity: WARNING
    languages: [xml]
    metadata:
      category: storage-credential
      kind: url
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: <bean id="$BEAN" ...>...</bean>
                  - pattern-inside: <bean class="$BEAN" ...>...</bean>
              - pattern: <property name="$NAME" value="$VALUE"/>
              - metavariable-regex:
                  metavariable: $NAME
                  regex: ^(url|URL|jdbcUrl|driverUrl)$
          - pattern: <bean id="$BEAN" p:url="$VALUE"/>
          - pattern: <bean class="$BEAN" p:url="$VALUE"/>
          - pattern: <bean id="$BEAN" p:jdbcUrl="$VALUE"/>
          - pattern: <bean class="$BEAN" p:jdbcUrl="$VALUE"/>
      - metavariable-regex:
          metavariable: $BEAN
          regex: (?i).*(datasource|jdbc|hikari|c3p0|dbcp|druid|bonecp|proxool).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?![$#]\{)\S
      - focus-metavariable: $VALUE

  - id: spring-xml-datasource-username
    message: A data source user name is written in a Spring XML context.
    severity: WARNING
    languages: [xml]
    metadata:
      category: storage-credential
      kind: account
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: <bean id="$BEAN" ...>...</bean>
                  - pattern-inside: <bean class="$BEAN" ...>...</bean>
              - pattern: <property name="$NAME" value="$VALUE"/>
              - metavariable-regex:
                  metavariable: $NAME
                  regex: ^(username|user)$
          - pattern: <bean id="$BEAN" p:username="$VALUE"/>
          - pattern: <bean class="$BEAN" p:username="$VALUE"/>
          - pattern: <bean id="$BEAN" p:user="$VALUE"/>
          - pattern: <bean class="$BEAN" p:user="$VALUE"/>
      - metavariable-regex:
          metavariable: $BEAN
          regex: (?i).*(datasource|jdbc|hikari|c3p0|dbcp|druid|bonecp|proxool).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?![$#]\{)\S
      - focus-metavariable: $VALUE

  # A password of any bean: a literal password in a Spring context is a
  # credential whatever the bean is (a data source, a mail sender, an LDAP or
  # FTP client). It is a property or a constructor argument whose name ends
  # in password or passwd in any case (password, dbPassword), given as an
  # attribute or a <value> child, or a p:password attribute.
  - id: spring-xml-password
    message: A password is written in a Spring XML context.
    severity: WARNING
    languages: [xml]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: <bean>...</bean>
              - pattern-either:
                  - pattern: <property name="$NAME" value="$VALUE"/>
                  - pattern: <property name="$NAME"><value>$VALUE</value></property>
                  - pattern: <constructor-arg name="$NAME" value="$VALUE"/>
                  - pattern: <constructor-arg name="$NAME"><value>$VALUE</value></constructor-arg>
              - metavariable-regex:
                  metavariable: $NAME
                  regex: (?i).*passw(or)?d$
          - pattern: <bean p:password="$VALUE"/>
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?![$#]\{)\S
      - focus-metavariable: $VALUE

  # Lines in .properties files where the last part of the key names a
  # password, a user name, a host, or a URL whose value is a JDBC URL. The key
  # and the value are separated by =, by :, or by white space alone. A
  # password key ends in password, passwd, or pwd (db.password, dbPassword,
  # db_pwd), or is pass or ends in _pass or -pass, so compass is not one.
  # Comment lines start with # or ! and do not match the key pattern.
  - id: properties-password
    message: A password is written in a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:[\w-]+\.)*(?:[\w-]*(?:password|passwd|pwd)|(?:[\w-]*[_-])?pass)(?:[ \t]*[=:][ \t]*|[ \t]+(?![=:]))(?![$#]\{)(?P<VALUE>\S[^\r\n]*?)[ \t]*\r?$
      - focus-metavariable: $VALUE

  # A user name is one word. A value with white space inside it is a
  # sentence, such as the message "User is required." under the key
  # confirm.required.user in a message bundle, and is not reported.
  - id: properties-username
    message: A user name is written in a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: account
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:[\w-]+\.)*(?:username|user|userid)(?:[ \t]*[=:][ \t]*|[ \t]+(?![=:]))(?![$#]\{)(?P<VALUE>\S+)[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: properties-jdbc-url
    message: A JDBC URL is written in a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: url
    patterns:
      - pattern-regex: (?mi)^[ \t]*[\w.-]*url(?:[ \t]*[=:][ \t]*|[ \t]+(?![=:]))(?P<VALUE>jdbc:\S+)
      - focus-metavariable: $VALUE

  - id: properties-host
    message: A host name is written in a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: host
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:[\w-]+\.)*(?:host|hostname)(?:[ \t]*[=:][ \t]*|[ \t]+(?![=:]))(?![$#]\{)(?P<VALUE>\S[^\r\n]*?)[ \t]*\r?$
      - focus-metavariable: $VALUE

  # key: value lines in application*.yml files. The value may be double- or
  # single-quoted, and may be followed by a # comment; neither the quotes nor
  # the comment are part of the reported value. Inside quotes, " #" is part
  # of the value. The (?|...) group numbers the three alternatives' values
  # alike, so each is $VALUE. A password key ends as in a .properties file.
  # A value that starts with > or | opens a block scalar and is not a value
  # itself.
  - id: yaml-password
    message: A password is written in a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:-[ \t]+)?(?:[\w-]+\.)*(?:[\w-]*(?:password|passwd|pwd)|(?:[\w-]*[_-])?pass)[ \t]*:[ \t]+(?|"(?![$#]\{)(?P<VALUE>[^"\r\n]+)"|'(?![$#]\{)([^'\r\n]+)'|(?![$#]\{)([^\s"'#>|][^\r\n]*?))(?:[ \t]+#[^\r\n]*)?[ \t]*\r?$
      - focus-metavariable: $VALUE

  # A password written as a block scalar: the key ends in > or |, and the
  # value is the one line below it, indented more than the key. A block of
  # two or more lines is not reported.
  - id: yaml-block-password
    message: A password is written as a block scalar in a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-regex: (?mi)^(?P<INDENT>[ \t]*)(?:[\w-]+\.)*(?:[\w-]*(?:password|passwd|pwd)|(?:[\w-]*[_-])?pass)[ \t]*:[ \t]+[>|][+-]?[ \t]*\r?\n(?P=INDENT)[ \t]+(?![$#]\{)(?P<VALUE>\S[^\r\n]*?)[ \t]*\r?$(?!\n(?P=INDENT)[ \t]+\S)
      - focus-metavariable: $VALUE

  - id: yaml-username
    message: A user name is written in a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: account
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:-[ \t]+)?(?:[\w-]+\.)*(?:username|user|userid)[ \t]*:[ \t]+(?|"(?![$#]\{)(?P<VALUE>[^"\r\n]+)"|'(?![$#]\{)([^'\r\n]+)'|(?![$#]\{)([^\s"'#>|][^\r\n]*?))(?:[ \t]+#[^\r\n]*)?[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: yaml-jdbc-url
    message: A JDBC URL is written in a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: url
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:-[ \t]+)?[\w.-]*url[ \t]*:[ \t]+["']?(?P<VALUE>jdbc:[^\s"']+)
      - focus-metavariable: $VALUE

  - id: yaml-host
    message: A host name is written in a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: host
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:-[ \t]+)?(?:[\w-]+\.)*(?:host|hostname)[ \t]*:[ \t]+(?|"(?![$#]\{)(?P<VALUE>[^"\r\n]+)"|'(?![$#]\{)([^'\r\n]+)'|(?![$#]\{)([^\s"'#>|][^\r\n]*?))(?:[ \t]+#[^\r\n]*)?[ \t]*\r?$
      - focus-metavariable: $VALUE
