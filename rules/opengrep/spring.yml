# Database settings in Spring XML contexts, .properties files, and
# application*.yml files. Every rule reports only the value: no quotes, no key
# name, no surrounding XML. Values that are a ${...} placeholder or empty are
# not reported.
#
# Every rule starts with "  - id:" and has its category and kind under
# metadata, which the rule tests read line by line.
rules:
  # <property name="url|username|password" value="..."/> inside a <bean>
  # whose id or class names a DataSource.
  - id: spring-xml-datasource-url
    message: A data source URL is written in a Spring XML context.
    severity: WARNING
    languages: [xml]
    metadata:
      category: storage-credential
      kind: url
    patterns:
      - pattern-either:
          - pattern-inside: <bean id="$BEAN" ...>...</bean>
          - pattern-inside: <bean class="$BEAN" ...>...</bean>
      - metavariable-regex:
          metavariable: $BEAN
          regex: (?i).*datasource
      - pattern: <property name="url" value="$VALUE"/>
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!\$\{)\S
      - focus-metavariable: $VALUE

  - id: spring-xml-datasource-username
    message: A data source user name is written in a Spring XML context.
    severity: WARNING
    languages: [xml]
    metadata:
      category: storage-credential
      kind: account
    patterns:
      - pattern-either:
          - pattern-inside: <bean id="$BEAN" ...>...</bean>
          - pattern-inside: <bean class="$BEAN" ...>...</bean>
      - metavariable-regex:
          metavariable: $BEAN
          regex: (?i).*datasource
      - pattern: <property name="username" value="$VALUE"/>
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!\$\{)\S
      - focus-metavariable: $VALUE

  - id: spring-xml-datasource-password
    message: A data source password is written in a Spring XML context.
    severity: WARNING
    languages: [xml]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-either:
          - pattern-inside: <bean id="$BEAN" ...>...</bean>
          - pattern-inside: <bean class="$BEAN" ...>...</bean>
      - metavariable-regex:
          metavariable: $BEAN
          regex: (?i).*datasource
      - pattern: <property name="password" value="$VALUE"/>
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!\$\{)\S
      - focus-metavariable: $VALUE

  # key=value or key: value lines in .properties files, where the last part
  # of the key is password, user name, host, or a URL whose value is a JDBC
  # URL. Comment lines start with # or ! and do not match the key pattern.
  - id: properties-password
    message: A password is written in a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:[\w-]+\.)*(?:password|passwd|pwd)[ \t]*[=:][ \t]*(?!\$\{)(?P<VALUE>\S[^\r\n]*?)[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: properties-username
    message: A user name is written in a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: account
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:[\w-]+\.)*(?:username|user|userid)[ \t]*[=:][ \t]*(?!\$\{)(?P<VALUE>\S[^\r\n]*?)[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: properties-jdbc-url
    message: A JDBC URL is written in a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: url
    patterns:
      - pattern-regex: (?mi)^[ \t]*[\w.-]*url[ \t]*[=:][ \t]*(?P<VALUE>jdbc:\S+)
      - focus-metavariable: $VALUE

  - id: properties-host
    message: A host name is written in a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: host
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:[\w-]+\.)*(?:host|hostname)[ \t]*[=:][ \t]*(?!\$\{)(?P<VALUE>\S[^\r\n]*?)[ \t]*\r?$
      - focus-metavariable: $VALUE

  # key: value lines in application*.yml files. The value may be quoted and
  # may be followed by a # comment; neither is part of the reported value.
  - id: yaml-password
    message: A password is written in a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:-[ \t]+)?(?:[\w-]+\.)*(?:password|passwd|pwd)[ \t]*:[ \t]+["']?(?!\$\{)(?P<VALUE>[^\s"'#][^\r\n"']*?)["']?(?:[ \t]+#[^\r\n]*)?[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: yaml-username
    message: A user name is written in a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: account
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:-[ \t]+)?(?:[\w-]+\.)*(?:username|user|userid)[ \t]*:[ \t]+["']?(?!\$\{)(?P<VALUE>[^\s"'#][^\r\n"']*?)["']?(?:[ \t]+#[^\r\n]*)?[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: yaml-jdbc-url
    message: A JDBC URL is written in a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: url
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:-[ \t]+)?[\w.-]*url[ \t]*:[ \t]+["']?(?P<VALUE>jdbc:[^\s"']+)
      - focus-metavariable: $VALUE

  - id: yaml-host
    message: A host name is written in a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: host
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:-[ \t]+)?(?:[\w-]+\.)*(?:host|hostname)[ \t]*:[ \t]+["']?(?!\$\{)(?P<VALUE>[^\s"'#][^\r\n"']*?)["']?(?:[ \t]+#[^\r\n]*)?[ \t]*\r?$
      - focus-metavariable: $VALUE
