# Database settings and passwords in Spring XML contexts, .properties files, and
# application*.yml files. Every rule reports only the value: no quotes, no key
# name, no surrounding XML. Values that are a ${...} placeholder or empty are
# not reported.
#
# Every rule starts with "  - id:" and has its category and kind under
# metadata, which the rule tests read line by line.
rules:
  # Connection settings of a connection pool or data source bean: a bean
  # whose id or class contains datasource, hikari, pool, c3p0, dbcp, or druid
  # (BasicDataSource, HikariConfig, ComboPooledDataSource, ...). The URL and
  # the user name are credentials only there; a mail sender's username or
  # url is not reported. A value is a <property name="..." value="..."/> or a
  # p: namespace attribute on the bean.
  - id: spring-xml-datasource-url
    message: A data source URL is written in a Spring XML context.
    severity: WARNING
    languages: [xml]
    metadata:
      category: storage-credential
      kind: url
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: <bean id="$BEAN" ...>...</bean>
                  - pattern-inside: <bean class="$BEAN" ...>...</bean>
              - pattern: <property name="$NAME" value="$VALUE"/>
              - metavariable-regex:
                  metavariable: $NAME
                  regex: ^(url|URL|jdbcUrl|driverUrl)$
          - pattern: <bean id="$BEAN" p:url="$VALUE"/>
          - pattern: <bean class="$BEAN" p:url="$VALUE"/>
          - pattern: <bean id="$BEAN" p:jdbcUrl="$VALUE"/>
          - pattern: <bean class="$BEAN" p:jdbcUrl="$VALUE"/>
      - metavariable-regex:
          metavariable: $BEAN
          regex: (?i).*(datasource|hikari|pool|c3p0|dbcp|druid).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!\$\{)\S
      - focus-metavariable: $VALUE

  - id: spring-xml-datasource-username
    message: A data source user name is written in a Spring XML context.
    severity: WARNING
    languages: [xml]
    metadata:
      category: storage-credential
      kind: account
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: <bean id="$BEAN" ...>...</bean>
                  - pattern-inside: <bean class="$BEAN" ...>...</bean>
              - pattern: <property name="$NAME" value="$VALUE"/>
              - metavariable-regex:
                  metavariable: $NAME
                  regex: ^(username|user)$
          - pattern: <bean id="$BEAN" p:username="$VALUE"/>
          - pattern: <bean class="$BEAN" p:username="$VALUE"/>
          - pattern: <bean id="$BEAN" p:user="$VALUE"/>
          - pattern: <bean class="$BEAN" p:user="$VALUE"/>
      - metavariable-regex:
          metavariable: $BEAN
          regex: (?i).*(datasource|hikari|pool|c3p0|dbcp|druid).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!\$\{)\S
      - focus-metavariable: $VALUE

  # A password property of any bean: a literal password in a Spring context
  # is a credential whatever the bean is (a data source, a mail sender, an
  # LDAP or FTP client). The value may be an attribute, a <value> child, or
  # a p:password attribute.
  - id: spring-xml-password
    message: A password is written in a Spring XML context.
    severity: WARNING
    languages: [xml]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: <bean>...</bean>
              - pattern-either:
                  - pattern: <property name="password" value="$VALUE"/>
                  - pattern: <property name="password"><value>$VALUE</value></property>
          - pattern: <bean p:password="$VALUE"/>
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!\$\{)\S
      - focus-metavariable: $VALUE

  # key=value or key: value lines in .properties files, where the last part
  # of the key is password, user name, host, or a URL whose value is a JDBC
  # URL. Comment lines start with # or ! and do not match the key pattern.
  - id: properties-password
    message: A password is written in a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:[\w-]+\.)*(?:password|passwd|pwd)[ \t]*[=:][ \t]*(?!\$\{)(?P<VALUE>\S[^\r\n]*?)[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: properties-username
    message: A user name is written in a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: account
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:[\w-]+\.)*(?:username|user|userid)[ \t]*[=:][ \t]*(?!\$\{)(?P<VALUE>\S[^\r\n]*?)[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: properties-jdbc-url
    message: A JDBC URL is written in a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: url
    patterns:
      - pattern-regex: (?mi)^[ \t]*[\w.-]*url[ \t]*[=:][ \t]*(?P<VALUE>jdbc:\S+)
      - focus-metavariable: $VALUE

  - id: properties-host
    message: A host name is written in a properties file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.properties"]
    metadata:
      category: storage-credential
      kind: host
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:[\w-]+\.)*(?:host|hostname)[ \t]*[=:][ \t]*(?!\$\{)(?P<VALUE>\S[^\r\n]*?)[ \t]*\r?$
      - focus-metavariable: $VALUE

  # key: value lines in application*.yml files. The value may be double- or
  # single-quoted, and may be followed by a # comment; neither the quotes nor
  # the comment are part of the reported value. Inside quotes, " #" is part
  # of the value. The (?|...) group numbers the three alternatives' values
  # alike, so each is $VALUE.
  - id: yaml-password
    message: A password is written in a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: password
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:-[ \t]+)?(?:[\w-]+\.)*(?:password|passwd|pwd)[ \t]*:[ \t]+(?|"(?!\$\{)(?P<VALUE>[^"\r\n]+)"|'(?!\$\{)([^'\r\n]+)'|(?!\$\{)([^\s"'#][^\r\n]*?))(?:[ \t]+#[^\r\n]*)?[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: yaml-username
    message: A user name is written in a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: account
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:-[ \t]+)?(?:[\w-]+\.)*(?:username|user|userid)[ \t]*:[ \t]+(?|"(?!\$\{)(?P<VALUE>[^"\r\n]+)"|'(?!\$\{)([^'\r\n]+)'|(?!\$\{)([^\s"'#][^\r\n]*?))(?:[ \t]+#[^\r\n]*)?[ \t]*\r?$
      - focus-metavariable: $VALUE

  - id: yaml-jdbc-url
    message: A JDBC URL is written in a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: url
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:-[ \t]+)?[\w.-]*url[ \t]*:[ \t]+["']?(?P<VALUE>jdbc:[^\s"']+)
      - focus-metavariable: $VALUE

  - id: yaml-host
    message: A host name is written in a Spring Boot YAML file.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["application*.yml", "application*.yaml"]
    metadata:
      category: storage-credential
      kind: host
    patterns:
      - pattern-regex: (?mi)^[ \t]*(?:-[ \t]+)?(?:[\w-]+\.)*(?:host|hostname)[ \t]*:[ \t]+(?|"(?!\$\{)(?P<VALUE>[^"\r\n]+)"|'(?!\$\{)([^'\r\n]+)'|(?!\$\{)([^\s"'#][^\r\n]*?))(?:[ \t]+#[^\r\n]*)?[ \t]*\r?$
      - focus-metavariable: $VALUE
