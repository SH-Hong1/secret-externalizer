# SSH credentials in shell scripts: the password given to sshpass -p (before
# the command sshpass runs, so an ssh -p port is not taken for it), the
# password assigned to SSHPASS for sshpass -e, the user and host of user@host
# on an ssh, scp, sftp, or rsync line, and the key file given to -i. The -i
# is reported only where it is an option of ssh, scp, or sftp itself. ssh
# reads its options, then the destination, then more options, and the first
# word after those starts the remote command, so the ssh rule walks the words
# in that order, skipping the argument of each option that takes one; a -i
# after the remote command has started (ssh host sed -i) is not reported.
# scp and sftp run no remote command; for them a -i after user@host, or inside
# a quoted string that began earlier, is not reported. A command whose name
# only begins with ssh (ssh-keygen) is not ssh. Comment lines and variables ($VAR) are not reported,
# and quotes around a value are not part of it; a quoted sshpass password may
# contain spaces. A (?|...) group numbers its alternatives' values alike, so
# each is $VALUE.
#
# Each rule reads the files with a shell extension, and has a twin whose id
# ends in -shebang for every other file whose first line is a shebang that
# runs sh, bash or ksh, as triage.ShellFile judges it (a byte order mark
# before it is allowed, as the scan reads the file without one). The twin's
# first pattern matches such a file whole, so the others match only inside
# it; it excludes the shell extensions, so no file is read by both.
#
# Every rule starts with "  - id:" and has its category and kind under
# metadata, which the rule tests read line by line.
rules:
  - id: shell-sshpass-password
    message: A password is passed to sshpass on the command line.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.sh", "*.bash", "*.ksh"]
    metadata:
      category: ssh-credential
      kind: password
    patterns:
      - pattern-regex: (?m)^[^#\r\n]*?\bsshpass\b(?:(?!\b(?:ssh|scp|sftp|rsync)\b)[^#\r\n])*?[ \t]-p[ \t]*(?|'(?P<VALUE>[^'\r\n]+)'|"([^"\r\n$]+)"|([^\s'"$][^\s'"]*))
      - focus-metavariable: $VALUE

  - id: shell-sshpass-env-password
    message: A password is assigned to SSHPASS for sshpass -e.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.sh", "*.bash", "*.ksh"]
    metadata:
      category: ssh-credential
      kind: password
    patterns:
      - pattern-regex: (?m)^[^#\r\n]*?(?<![\w$])SSHPASS=(?|'(?P<VALUE>[^'\r\n]+)'|"([^"\r\n$]+)"|([^\s'"$;][^\s'";]*))
      - focus-metavariable: $VALUE

  - id: shell-ssh-user
    message: An ssh user name is written in a shell script.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.sh", "*.bash", "*.ksh"]
    metadata:
      category: ssh-credential
      kind: account
    patterns:
      - pattern-regex: (?m)^[^#\r\n]*\b(?:ssh|scp|sftp|rsync)\b[^#\r\n]*
      - pattern-regex: (?<![\w.@$-])(?P<USER>[A-Za-z_][\w.-]*)@(?P<HOST>[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?)
      - focus-metavariable: $USER

  - id: shell-ssh-host
    message: An ssh host is written in a shell script.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.sh", "*.bash", "*.ksh"]
    metadata:
      category: ssh-credential
      kind: host
    patterns:
      - pattern-regex: (?m)^[^#\r\n]*\b(?:ssh|scp|sftp|rsync)\b[^#\r\n]*
      - pattern-regex: (?<![\w.@$-])(?P<USER>[A-Za-z_][\w.-]*)@(?P<HOST>[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?)
      - focus-metavariable: $HOST

  - id: shell-ssh-identity
    message: An ssh key file is named in a shell script.
    severity: WARNING
    languages: [regex]
    paths:
      include: ["*.sh", "*.bash", "*.ksh"]
    metadata:
      category: ssh-credential
      kind: key-file
    patterns:
      - pattern-either:
          - pattern-regex: (?m)^[^#\r\n]*?(?<![\w.-])ssh(?:[ \t]+-[46AaCfGgKkMNnqsTtVvXxYy]*(?:[BbcDEeFIJLlmOoPpQRSWw][ \t]*(?:"[^"\r\n]*"|'[^'\r\n]*'|[^\s'"]+))?(?=\s))*(?:[ \t]+(?:"[^"\r\n]*"|'[^'\r\n]*'|[^\s'"#-][^\s'"]*)(?:[ \t]+-[46AaCfGgKkMNnqsTtVvXxYy]*(?:[BbcDEeFIJLlmOoPpQRSWw][ \t]*(?:"[^"\r\n]*"|'[^'\r\n]*'|[^\s'"]+))?(?=\s))*)?[ \t]+-i[ \t]*['"]?(?P<VALUE>[^\s'"$][^\s'"]*)
          - pattern-regex: (?m)^[^#\r\n]*?(?<![\w.-])(?:scp|sftp)(?=[ \t])(?:[^#\r\n'"@]|"[^"\r\n]*"|'[^'\r\n]*')*?[ \t]-i[ \t]*['"]?(?P<VALUE>[^\s'"$][^\s'"]*)
      - focus-metavariable: $VALUE

  - id: shell-sshpass-password-shebang
    message: A password is passed to sshpass on the command line.
    severity: WARNING
    languages: [regex]
    paths:
      exclude: ["*.sh", "*.bash", "*.ksh"]
    metadata:
      category: ssh-credential
      kind: password
    patterns:
      - pattern-regex: (?s)\A\x{FEFF}?#![ \t]*(?:[^\s/]*/)*(?:env[ \t]+(?:-\S*[ \t]+)*(?:[^\s/]*/)*)?(?:ba|k)?sh(?:[ \t][^\r\n]*)?(?:\r?\n.*|\r)?\z
      - pattern-regex: (?m)^[^#\r\n]*?\bsshpass\b(?:(?!\b(?:ssh|scp|sftp|rsync)\b)[^#\r\n])*?[ \t]-p[ \t]*(?|'(?P<VALUE>[^'\r\n]+)'|"([^"\r\n$]+)"|([^\s'"$][^\s'"]*))
      - focus-metavariable: $VALUE

  - id: shell-sshpass-env-password-shebang
    message: A password is assigned to SSHPASS for sshpass -e.
    severity: WARNING
    languages: [regex]
    paths:
      exclude: ["*.sh", "*.bash", "*.ksh"]
    metadata:
      category: ssh-credential
      kind: password
    patterns:
      - pattern-regex: (?s)\A\x{FEFF}?#![ \t]*(?:[^\s/]*/)*(?:env[ \t]+(?:-\S*[ \t]+)*(?:[^\s/]*/)*)?(?:ba|k)?sh(?:[ \t][^\r\n]*)?(?:\r?\n.*|\r)?\z
      - pattern-regex: (?m)^[^#\r\n]*?(?<![\w$])SSHPASS=(?|'(?P<VALUE>[^'\r\n]+)'|"([^"\r\n$]+)"|([^\s'"$;][^\s'";]*))
      - focus-metavariable: $VALUE

  - id: shell-ssh-user-shebang
    message: An ssh user name is written in a shell script.
    severity: WARNING
    languages: [regex]
    paths:
      exclude: ["*.sh", "*.bash", "*.ksh"]
    metadata:
      category: ssh-credential
      kind: account
    patterns:
      - pattern-regex: (?s)\A\x{FEFF}?#![ \t]*(?:[^\s/]*/)*(?:env[ \t]+(?:-\S*[ \t]+)*(?:[^\s/]*/)*)?(?:ba|k)?sh(?:[ \t][^\r\n]*)?(?:\r?\n.*|\r)?\z
      - pattern-regex: (?m)^[^#\r\n]*\b(?:ssh|scp|sftp|rsync)\b[^#\r\n]*
      - pattern-regex: (?<![\w.@$-])(?P<USER>[A-Za-z_][\w.-]*)@(?P<HOST>[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?)
      - focus-metavariable: $USER

  - id: shell-ssh-host-shebang
    message: An ssh host is written in a shell script.
    severity: WARNING
    languages: [regex]
    paths:
      exclude: ["*.sh", "*.bash", "*.ksh"]
    metadata:
      category: ssh-credential
      kind: host
    patterns:
      - pattern-regex: (?s)\A\x{FEFF}?#![ \t]*(?:[^\s/]*/)*(?:env[ \t]+(?:-\S*[ \t]+)*(?:[^\s/]*/)*)?(?:ba|k)?sh(?:[ \t][^\r\n]*)?(?:\r?\n.*|\r)?\z
      - pattern-regex: (?m)^[^#\r\n]*\b(?:ssh|scp|sftp|rsync)\b[^#\r\n]*
      - pattern-regex: (?<![\w.@$-])(?P<USER>[A-Za-z_][\w.-]*)@(?P<HOST>[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?)
      - focus-metavariable: $HOST

  - id: shell-ssh-identity-shebang
    message: An ssh key file is named in a shell script.
    severity: WARNING
    languages: [regex]
    paths:
      exclude: ["*.sh", "*.bash", "*.ksh"]
    metadata:
      category: ssh-credential
      kind: key-file
    patterns:
      - pattern-regex: (?s)\A\x{FEFF}?#![ \t]*(?:[^\s/]*/)*(?:env[ \t]+(?:-\S*[ \t]+)*(?:[^\s/]*/)*)?(?:ba|k)?sh(?:[ \t][^\r\n]*)?(?:\r?\n.*|\r)?\z
      - pattern-either:
          - pattern-regex: (?m)^[^#\r\n]*?(?<![\w.-])ssh(?:[ \t]+-[46AaCfGgKkMNnqsTtVvXxYy]*(?:[BbcDEeFIJLlmOoPpQRSWw][ \t]*(?:"[^"\r\n]*"|'[^'\r\n]*'|[^\s'"]+))?(?=\s))*(?:[ \t]+(?:"[^"\r\n]*"|'[^'\r\n]*'|[^\s'"#-][^\s'"]*)(?:[ \t]+-[46AaCfGgKkMNnqsTtVvXxYy]*(?:[BbcDEeFIJLlmOoPpQRSWw][ \t]*(?:"[^"\r\n]*"|'[^'\r\n]*'|[^\s'"]+))?(?=\s))*)?[ \t]+-i[ \t]*['"]?(?P<VALUE>[^\s'"$][^\s'"]*)
          - pattern-regex: (?m)^[^#\r\n]*?(?<![\w.-])(?:scp|sftp)(?=[ \t])(?:[^#\r\n'"@]|"[^"\r\n]*"|'[^'\r\n]*')*?[ \t]-i[ \t]*['"]?(?P<VALUE>[^\s'"$][^\s'"]*)
      - focus-metavariable: $VALUE
