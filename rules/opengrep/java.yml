# String literals in Java sources that hold a secret. The reported value is
# the literal's content without its quotes. Empty literals are not reported.
#
# Every rule starts with "  - id:" and has its category and kind under
# metadata, which the rule tests read line by line.
rules:
  # A literal assigned to a variable or field whose name contains passw,
  # secret, token, or pwd (any case), or ends in Pass, PASS, Pw, or PW, or is
  # pass or pw, in a declaration or an assignment. The endings are matched
  # with their case so that dbPass and DB_PASS are reported but compass is
  # not. A name that says the literal is the name of something or a message
  # is not reported: one that ends in header, name, field, param, attribute,
  # label, prefix, suffix, type, url, uri, path, pattern, or format
  # (TOKEN_HEADER, passwordParam), or starts with msg, message, err, error,
  # label, title, or text (MSG_PWD).
  - id: java-secret-variable
    message: A string literal is assigned to a variable whose name says it holds a secret.
    severity: WARNING
    languages: [java]
    metadata:
      category: other-secret
      kind: password
    patterns:
      - pattern-either:
          - pattern: $TYPE $NAME = "$VALUE";
          - pattern: $NAME = "$VALUE";
      - metavariable-regex:
          metavariable: $NAME
          regex: ((?i:.*(passw|secret|token|pwd).*)|.*[a-z0-9_](Pass|PASS|Pw|PW)|(?i:pass|pw))$
      - metavariable-regex:
          metavariable: $NAME
          regex: ^(?!(?i:.*(header|name|field|param|parameter|attr|attribute|label|prefix|suffix|type|url|uri|path|pattern|format)$))(?!(?:MSG|MESSAGE|ERR|ERROR|LABEL|TITLE|TEXT)_)(?!(?:msg|message|err|error|label|title|text)[A-Z])
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.
      - focus-metavariable: $VALUE

  # A literal passed to a setPassword method, as on a DataSource.
  - id: java-set-password
    message: A string literal is passed to setPassword.
    severity: WARNING
    languages: [java]
    metadata:
      category: other-secret
      kind: password
    patterns:
      - pattern: $OBJ.setPassword("$VALUE")
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.
      - focus-metavariable: $VALUE

  # A literal password put into a Properties object, as passed to
  # DriverManager.getConnection(url, props).
  - id: java-set-property-password
    message: A string literal is set as a password property.
    severity: WARNING
    languages: [java]
    metadata:
      category: other-secret
      kind: password
    patterns:
      - pattern: $OBJ.setProperty("$KEY", "$VALUE")
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(passw|pwd).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.
      - focus-metavariable: $VALUE

  # A literal password passed to getConnection(url, user, password).
  - id: java-get-connection-password
    message: A string literal is passed as the password to getConnection.
    severity: WARNING
    languages: [java]
    metadata:
      category: other-secret
      kind: password
    patterns:
      - pattern-either:
          - pattern: $OBJ.getConnection($URL, $USER, "$VALUE")
          - pattern: getConnection($URL, $USER, "$VALUE")
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.
      - focus-metavariable: $VALUE
