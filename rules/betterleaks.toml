# Rules for betterleaks. The built-in rules stay on and report their results
# as other-secret, or ssh-credential for private keys. Each rule below gives
# its category and kind in tags, and its capture group is exactly the value.
#
# Every [[rules]] table has one id line and one tags line in the form
# tags = ["category:<category>", "kind:<kind>"], which the rule tests read.

[extend]
useDefault = true

# Customer data is looked for only in logs and sample data: files with the
# extensions log, csv, tsv, txt, sql, dat, and json, and files under a folder
# named log, logs, sample, samples, data, or dump. The patterns are kept
# narrow; the address pattern in particular misses many addresses and
# reports some text that is not one.

# A phone number is written with hyphens, or, for a mobile number only,
# as ten or eleven digits in a row that are not part of a longer number.
[[rules]]
id = "customer-phone"
description = "Korean mobile or landline phone number"
regex = '''\b(0(?:1[016789]|2|[3-6][1-5])-[0-9]{3,4}-[0-9]{4}|01[016789][0-9]{7,8})\b'''
secretGroup = 1
path = '''(?i)(?:\.(?:(?:log|out)(?:[.\-_][0-9][^/]*|\.old|\.bak)?|csv|tsv|txt|sql|dat|json)$|(?:^|/)(?:logs?|samples?|data|dump)/)'''
tags = ["category:customer-data", "kind:phone"]

# The digit after the hyphen is 1 to 4 in a resident registration number
# and 5 to 8 in a foreigner registration number.
[[rules]]
id = "customer-rrn"
description = "Korean resident or foreigner registration number"
regex = '''\b([0-9]{6}-[1-8][0-9]{6})\b'''
secretGroup = 1
path = '''(?i)(?:\.(?:(?:log|out)(?:[.\-_][0-9][^/]*|\.old|\.bak)?|csv|tsv|txt|sql|dat|json)$|(?:^|/)(?:logs?|samples?|data|dump)/)'''
tags = ["category:customer-data", "kind:rrn"]

[[rules]]
id = "customer-email"
description = "E-mail address"
regex = '''\b([A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,})\b'''
secretGroup = 1
path = '''(?i)(?:\.(?:(?:log|out)(?:[.\-_][0-9][^/]*|\.old|\.bak)?|csv|tsv|txt|sql|dat|json)$|(?:^|/)(?:logs?|samples?|data|dump)/)'''
tags = ["category:customer-data", "kind:email"]

[[rules]]
id = "customer-card"
description = "Card number written as four groups of four digits"
regex = '''\b([0-9]{4}[- ][0-9]{4}[- ][0-9]{4}[- ][0-9]{4})\b'''
secretGroup = 1
path = '''(?i)(?:\.(?:(?:log|out)(?:[.\-_][0-9][^/]*|\.old|\.bak)?|csv|tsv|txt|sql|dat|json)$|(?:^|/)(?:logs?|samples?|data|dump)/)'''
tags = ["category:customer-data", "kind:card"]

# A Korean address: a word ending in 시 or 도, then one ending in 구 or 군,
# then one ending in 동, 읍, 면, 로, or 길, optionally followed by a number.
[[rules]]
id = "customer-address"
description = "Korean street address"
regex = '''([가-힣]+(?:시|도)[ \t]+[가-힣]+(?:구|군)[ \t]+[가-힣0-9]+(?:동|읍|면|로|길)(?:[ \t]+[0-9]+(?:-[0-9]+)?)?)'''
secretGroup = 1
path = '''(?i)(?:\.(?:(?:log|out)(?:[.\-_][0-9][^/]*|\.old|\.bak)?|csv|tsv|txt|sql|dat|json)$|(?:^|/)(?:logs?|samples?|data|dump)/)'''
tags = ["category:customer-data", "kind:address"]

# A partner's session: the value of a JSESSIONID cookie anywhere, and the
# value of the first cookie in a Cookie: header or in a call that sets the
# header, such as setRequestProperty("Cookie", "NAME=value").
[[rules]]
id = "partner-session-cookie"
description = "Session cookie value"
regex = '''(?i)(?:\bjsessionid=|\bcookie(?::[ \t]*|"[ \t]*,[ \t]*")[A-Za-z0-9_.-]+=)([^;"'\s]{8,})'''
secretGroup = 1
keywords = ["jsessionid", "cookie"]
tags = ["category:partner-session", "kind:token"]

[[rules]]
id = "partner-bearer-token"
description = "Bearer token in an Authorization header, with any base64 padding"
regex = '''(?i)\bbearer[ \t]+([A-Za-z0-9._~+/-]{16,}=*)'''
secretGroup = 1
keywords = ["bearer"]
tags = ["category:partner-session", "kind:token"]
