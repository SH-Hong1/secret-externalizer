# Local development stack: postgres, valkey, keycloak, openbao, web, and
# worker.
#
# Every password and secret in this file, in deploy/postgres/init.sql, and in
# deploy/keycloak/realm.json is a fake value for local development only. Do
# not reuse this file for any shared or deployed environment.
#
# Published ports bind to 127.0.0.1 only:
#   web       http://localhost:8080
#   keycloak  http://localhost:8081  (admin console user: dev-only-admin)
#   valkey    127.0.0.1:16379        (for integration tests; 6379 is often taken
#                                     by a locally installed redis)
#   postgres  127.0.0.1:15432        (for integration tests)
#   openbao-test 127.0.0.1:18200     (profile "test", for integration tests)
#
# openbao publishes no port: only the worker and web reach it, on the compose
# network.

name: secret-externalizer

services:
  postgres:
    image: postgres:18.7-alpine3.24@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-only-postgres-password # local development only
      # The application database is created empty; init.sql gives it to the
      # se_app role and adds the keycloak and test databases.
      POSTGRES_DB: secret_externalizer
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "keycloak"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    # Sessions and login attempts are short-lived, so valkey keeps nothing on
    # disk: restarting it signs everyone out.
    #
    # Memory is capped so that unauthenticated GET /login requests cannot
    # grow valkey without bound. At the cap, noeviction makes new writes fail:
    # new logins see the 503 page, while existing sessions keep working and
    # expire as usual. Any evicting policy would instead drop live sessions or
    # pending login attempts without telling anyone.
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: dev-only-keycloak-db-password # local development only
      # Browsers reach keycloak at localhost:8081, so every front-channel URL
      # and the token issuer use that address. Requests from other containers
      # arrive at keycloak:8080; with dynamic backchannel URLs the discovery
      # document they read points the token and key endpoints there, while the
      # issuer, the login page, and the logout page stay on localhost:8081.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: dev-only-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only-admin-password # local development only
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl, so bash asks the management port directly.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": *"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  # Writes the OpenBao unseal key and the AppRole secret-ids into the
  # openbao-secrets volume on the first start, and leaves existing files alone
  # afterwards. See deploy/openbao/make-secrets.sh.
  openbao-secrets:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint: ["/bin/sh", "/make-secrets.sh"]
    environment:
      # The user the worker runs as, which must own the worker's secret-id.
      SE_UID: ${SE_UID:-65532}
    volumes:
      - ./deploy/openbao/make-secrets.sh:/make-secrets.sh:ro
      - openbao-secrets:/secrets
    # Root is needed to give each file its owner. It keeps only the
    # capabilities for that: changing owners and modes, and reaching files
    # that already belong to another user.
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Holds the original values that scans find. It publishes no host port.
  openbao:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint: ["bao", "server", "-config=/openbao/config/config.hcl"]
    volumes:
      - ./deploy/openbao/config.hcl:/openbao/config/config.hcl:ro
      # /openbao/file belongs to the openbao user in the image, so the new
      # volume starts with that owner.
      - openbao-data:/openbao/file
      - openbao-secrets:/openbao/secrets:ro
    user: "100:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    depends_on:
      openbao-secrets:
        condition: service_completed_successfully
    healthcheck:
      # bao status exits 0 only when the server is initialised and unsealed.
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 30

  # An in-memory OpenBao for the integration tests, started only with
  # --profile test. It never holds real values.
  openbao-test:
    profiles: ["test"]
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint:
      - bao
      - server
      - -dev
      - -dev-root-token-id=dev-only-openbao-test-root-token # local tests only
      - -dev-listen-address=0.0.0.0:8200
    environment:
      HOME: /tmp
    ports:
      - "127.0.0.1:18200:8200"
    user: "100:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        VERSION: compose-dev
    environment:
      WEB_ADDR: ":8080"
      WEB_BASE_URL: http://localhost:8080
      VALKEY_ADDR: valkey:6379
      DATABASE_URL: postgres://se_app:dev-only-se-app-password@postgres:5432/secret_externalizer # local development only
      OIDC_ISSUER_URL: http://localhost:8081/realms/secret-externalizer
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/secret-externalizer
      OIDC_CLIENT_ID: secret-externalizer-web
      OIDC_CLIENT_SECRET: dev-only-web-client-secret # local development only; matches realm.json
      # Web reads an original only when an admin asks to reveal one.
      BAO_ADDR: http://openbao:8200
      BAO_ROLE_ID: se-web
      BAO_SECRET_ID_FILE: /run/secrets/openbao/secret-id
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Only web's own directory of the openbao-secrets volume, so web cannot
      # read the unseal key or the worker role's secret-id.
      - type: volume
        source: openbao-secrets
        target: /run/secrets/openbao
        read_only: true
        volume:
          subpath: web
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Started, not healthy: openbao starts only after openbao-secrets has
      # written web's secret-id, and web starts and serves every other page
      # while OpenBao is not ready.
      openbao:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: deploy/worker/Dockerfile
      args:
        VERSION: compose-dev
    environment:
      DATABASE_URL: postgres://se_app:dev-only-se-app-password@postgres:5432/secret_externalizer # local development only
      WORKSPACE_ROOT: /workspace
      APPLY_WORKSPACE_ROOT: /workspace-rw
      BAO_ADDR: http://openbao:8200
      BAO_ROLE_ID: se-worker
      BAO_SECRET_ID_FILE: /run/secrets/openbao/secret-id
      # The scanners and rules the worker image holds.
      BETTERLEAKS_BIN: /usr/local/bin/betterleaks
      OPENGREP_BIN: /usr/local/bin/opengrep
      RULES_DIR: /rules
      # On the /tmp tmpfs: the scanners' home and temporary folders and the
      # UTF-8 copies of a scan's EUC-KR files, removed when the scan ends.
      SCAN_TEMP_DIR: /tmp/scan
    volumes:
      # The same host folder twice. Scans and the scanners use only the
      # read-only mount; only an apply the user confirmed changes files,
      # through the read-write mount.
      - ${SE_WORKSPACE:?set SE_WORKSPACE to the folder that holds the projects to scan, for example SE_WORKSPACE=$$HOME/work docker compose up}:/workspace:ro
      - ${SE_WORKSPACE:?set SE_WORKSPACE to the folder that holds the projects to scan, for example SE_WORKSPACE=$$HOME/work docker compose up}:/workspace-rw
      # Only the worker's own directory of the openbao-secrets volume, so the
      # worker cannot read the unseal key or the web role's secret-id.
      - type: volume
        source: openbao-secrets
        target: /run/secrets/openbao
        read_only: true
        volume:
          subpath: worker
    # Files an apply writes belong to this user. On a Linux host, set
    # SE_UID=$(id -u) SE_GID=$(id -g) so that is the owner of the workspace.
    user: "${SE_UID:-65532}:${SE_GID:-65532}"
    read_only: true
    tmpfs:
      # Holds the UTF-8 copies of the EUC-KR files of the scan that is
      # running, so it must fit those; it counts against the host's memory.
      - /tmp:size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    # A worker that stopped takes up its jobs again once their leases end.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy

volumes:
  postgres-data:
  openbao-data:
  openbao-secrets:
