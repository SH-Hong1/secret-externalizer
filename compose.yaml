# Local development stack: postgres, valkey, keycloak, openbao, pdf, web,
# worker, which scans, and applier, which applies.
#
# Every password and secret in this file, in deploy/postgres/init.sql, and in
# deploy/keycloak/realm.json is a fake value for local development only. Do
# not reuse this file for any shared or deployed environment.
#
# Published ports bind to 127.0.0.1 only:
#   web       http://localhost:8080
#   keycloak  http://localhost:8081  (admin console user: dev-only-admin)
#   postgres  127.0.0.1:15432        (for integration tests)
#   valkey-test  127.0.0.1:16379     (profile "test", for integration tests;
#                                     6379 is often taken by a locally
#                                     installed redis)
#   openbao-test 127.0.0.1:18200     (profile "test", for integration tests)
#   pdf-test  127.0.0.1:13000        (profile "test", for integration tests)
#
# Each network carries only the connections that need it; see decision 0065
# and the networks section at the end of this file. No service can open a
# connection outside the host's container network: the networks with
# published ports have NAT turned off, and the others are internal. openbao
# publishes no port and only web, the worker, the applier, and openbao-roles
# reach it.
# valkey publishes no port either and only web reaches it, over TLS and as its
# own ACL user. The worker, and so the scanners it runs, and the applier are
# only on internal networks. pdf publishes no port either and sits alone with
# web on the internal network "pdf"; see decision 0043. web, the worker, and
# the applier reach openbao over TLS.
#
# OpenBao's unseal key and the secret-id of its admin role are files on the
# host, outside every volume: OPENBAO_UNSEAL_KEY_FILE and
# OPENBAO_ADMIN_SECRET_ID_FILE, or openbao-unseal.key and
# openbao-admin.secret-id in $HOME/.config/secret-externalizer when unset.
# Make them with `make openbao-host-files` before the first `up`; see
# deploy/openbao/unseal-key.sh, deploy/openbao/admin-secret-id.sh, and
# decisions 0067 and 0069.

name: secret-externalizer

services:
  postgres:
    image: postgres:18.7-alpine3.24@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-only-postgres-password # local development only
      # The application database is created empty; init.sql gives it to the
      # se_app role and adds the keycloak and test databases.
      POSTGRES_DB: secret_externalizer
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    ports:
      - "127.0.0.1:15432:5432"
    # edge for the host port, keycloak, and web; db for the worker and the
    # applier.
    networks:
      - edge
      - db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "keycloak"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Writes valkey's TLS certificate, its ACL file, and web's valkey password
  # into the valkey-secrets volume on the first start, and leaves existing
  # files alone afterwards. See deploy/valkey/make-secrets.sh. It uses the
  # converter's image because that is the one pinned image here that has
  # openssl; it runs nothing else from it.
  valkey-secrets:
    image: gotenberg/gotenberg:9.9.1-chromium@sha256:d722dfb3105c00f775125f13e3613ecbdb0040b12a7b8245c1d98ebafaefedd4
    entrypoint: ["/bin/sh", "/make-secrets.sh"]
    environment:
      HOME: /tmp
    volumes:
      - ./deploy/valkey/make-secrets.sh:/make-secrets.sh:ro
      - valkey-secrets:/secrets
    # It only writes files into the volume.
    network_mode: none
    # Root is needed to give each file its owner. It keeps only the
    # capabilities for that: changing owners and modes, and reaching files
    # that already belong to another user.
    user: "0:0"
    read_only: true
    tmpfs:
      # The CA's private key lives here and goes with the container.
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  valkey: &valkey
    image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    # Sessions and login attempts are short-lived, so valkey keeps nothing on
    # disk: restarting it signs everyone out.
    #
    # Memory is capped so that unauthenticated GET /login requests cannot
    # grow valkey without bound. At the cap, noeviction makes new writes fail:
    # new logins see the 503 page, while existing sessions keep working and
    # expire as usual. Any evicting policy would instead drop live sessions or
    # pending login attempts without telling anyone.
    #
    # It answers only TLS, on 6379, and only to the users in users.acl: web
    # signs in as se-web, and the health check as health, which may only
    # PING. Clients show no certificate; web's password is the client's
    # proof.
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /run/secrets/valkey/tls.crt
      - --tls-key-file
      - /run/secrets/valkey/tls.key
      - --tls-ca-cert-file
      - /run/secrets/valkey/ca.crt
      - --tls-auth-clients
      - "no"
      - --aclfile
      - /run/secrets/valkey/users.acl
    volumes:
      # Only valkey's own directory of the valkey-secrets volume, so valkey
      # cannot read web's password.
      - type: volume
        source: valkey-secrets
        target: /run/secrets/valkey
        read_only: true
        volume:
          subpath: valkey
    networks:
      - valkey
    user: "999:999"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      valkey-secrets:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          valkey-cli --tls --cacert /run/secrets/valkey/ca.crt
          --user health --pass health --no-auth-warning ping | grep -q PONG
      interval: 2s
      timeout: 3s
      retries: 30

  # A valkey for the integration tests, started only with --profile test. It
  # answers plain connections with a fixed password, and never holds a real
  # session.
  valkey-test:
    <<: *valkey
    profiles: ["test"]
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - dev-only-valkey-test-password # local tests only
    volumes: []
    ports:
      - "127.0.0.1:16379:6379"
    networks:
      - test
    depends_on: {}
    healthcheck:
      test: ["CMD", "valkey-cli", "--no-auth-warning", "-a", "dev-only-valkey-test-password", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: dev-only-keycloak-db-password # local development only
      # Browsers reach keycloak at localhost:8081, so every front-channel URL
      # and the token issuer use that address. Requests from other containers
      # arrive at keycloak:8080; with dynamic backchannel URLs the discovery
      # document they read points the token and key endpoints there, while the
      # issuer, the login page, and the logout page stay on localhost:8081.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: dev-only-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only-admin-password # local development only
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - edge
    volumes:
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl, so bash asks the management port directly.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": *"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  # Writes the AppRole secret-ids and OpenBao's TLS certificate into the
  # openbao-secrets volume on the first start, and leaves existing files alone
  # afterwards. See deploy/openbao/make-secrets.sh. It uses the converter's
  # image because that is the one pinned image here that has openssl; it
  # runs nothing else from it.
  openbao-secrets:
    image: gotenberg/gotenberg:9.9.1-chromium@sha256:d722dfb3105c00f775125f13e3613ecbdb0040b12a7b8245c1d98ebafaefedd4
    entrypoint: ["/bin/sh", "/make-secrets.sh"]
    environment:
      HOME: /tmp
      # The user and group the worker and the applier run as; the user must
      # own their secret-id. The script refuses root and non-numbers.
      SE_UID: ${SE_UID:-65532}
      SE_GID: ${SE_GID:-65532}
    volumes:
      - ./deploy/openbao/make-secrets.sh:/make-secrets.sh:ro
      - openbao-secrets:/secrets
    # It only writes files into the volume.
    network_mode: none
    # Root is needed to give each file its owner. It keeps only the
    # capabilities for that: changing owners and modes, and reaching files
    # that already belong to another user.
    user: "0:0"
    read_only: true
    tmpfs:
      # The CA's private key lives here and goes with the container.
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Holds the original values that scans find. It publishes no host port.
  openbao:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint:
      - bao
      - server
      - -config=/openbao/config/config.hcl
      - -config=/openbao/config/seal.hcl
    volumes:
      - ./deploy/openbao/config.hcl:/openbao/config/config.hcl:ro
      - ./deploy/openbao/seal-static.hcl:/openbao/config/seal.hcl:ro
      # /openbao/file belongs to the openbao user in the image, so the new
      # volume starts with that owner.
      - openbao-data:/openbao/file
      - openbao-secrets:/openbao/secrets:ro
    # The unseal key, at /run/secrets/openbao-unseal-key, which no other
    # service mounts, and the admin role's secret-id, which
    # self-initialisation registers on the first start.
    secrets:
      - openbao-unseal-key
      - openbao-admin-secret-id
    networks:
      - bao
    user: "100:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    depends_on:
      openbao-secrets:
        condition: service_completed_successfully
    healthcheck:
      # bao status exits 0 only when the server is initialised and unsealed.
      test: ["CMD", "bao", "status", "-address=https://127.0.0.1:8200", "-ca-cert=/openbao/secrets/tls/ca.crt"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Brings OpenBao's roles and policies to what deploy/openbao/roles.sh and
  # deploy/openbao/policies/ declare, on every `up`, logged in as the admin
  # role; see decision 0069. It then exits. The worker and the applier start
  # after it has finished; web does not wait, as it does not wait for
  # OpenBao.
  openbao-roles:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint: ["/bin/sh", "/roles.sh"]
    environment:
      HOME: /tmp
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /secrets/web/ca.crt
    volumes:
      - ./deploy/openbao/roles.sh:/roles.sh:ro
      - ./deploy/openbao/policies:/policies:ro
      # The three role directories of the openbao-secrets volume, for the
      # secret-ids it registers; not OpenBao's private key. OpenBao's group,
      # which this service runs as, reads them.
      - type: volume
        source: openbao-secrets
        target: /secrets/worker
        read_only: true
        volume:
          subpath: worker
      - type: volume
        source: openbao-secrets
        target: /secrets/applier
        read_only: true
        volume:
          subpath: applier
      - type: volume
        source: openbao-secrets
        target: /secrets/web
        read_only: true
        volume:
          subpath: web
    secrets:
      - openbao-admin-secret-id
    networks:
      - bao
    user: "100:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    depends_on:
      openbao:
        condition: service_healthy

  # An in-memory OpenBao for the integration tests, started only with
  # --profile test. It never holds real values.
  openbao-test:
    profiles: ["test"]
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint:
      - bao
      - server
      - -dev
      - -dev-root-token-id=dev-only-openbao-test-root-token # local tests only
      - -dev-listen-address=0.0.0.0:8200
    environment:
      HOME: /tmp
    ports:
      - "127.0.0.1:18200:8200"
    networks:
      - test
    user: "100:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Prints the report page that web sends to a PDF with Chromium. It reads
  # only the files of the request and reaches nothing: its only network is
  # the internal network "pdf", and Chromium may open only the files that
  # Gotenberg wrote for the request, in /tmp/<uuid>/<uuid>/. See decision
  # 0043.
  pdf: &pdf
    # 9.9.1-chromium, the Chromium-only image; the digest is the multi-arch
    # index (linux/amd64 and linux/arm64 among others).
    image: gotenberg/gotenberg:9.9.1-chromium@sha256:d722dfb3105c00f775125f13e3613ecbdb0040b12a7b8245c1d98ebafaefedd4
    command:
      - gotenberg
      # The PDF routes (merge, split, sign, ...) and the PDF stages of the
      # Chromium route are off; only the HTML and URL print routes stay.
      - --pdf-disable-routes=true
      - --pdf-disable-stages=true
      # No script runs in the page.
      - --chromium-disable-javascript=true
      # Chromium opens only files directly in a request folder,
      # /tmp/<uuid>/<uuid>/<name>. Every other address, file:// elsewhere
      # (Chromium's profile and caches under /tmp included) and any
      # http(s), is refused. Gotenberg also refuses, by itself, a file://
      # address outside the folder of the request being printed. The IP
      # rules refuse any host even if an address slips past the list.
      - --chromium-allow-list=^file:///tmp/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[^/]+$$
      - --chromium-deny-private-ips=true
      - --chromium-deny-public-ips=true
      # Gotenberg itself fetches and calls nothing.
      - --webhook-disable=true
      - --api-disable-download-from=true
      # Shorter than web's 20 second limit for one conversion, so Gotenberg
      # answers 503 before web gives up.
      - --api-timeout=15s
      # A report with its stylesheet and fonts is about 5 MB.
      - --api-body-limit=32MB
      # Chromium starts with the container, not on the first export.
      - --chromium-auto-start=true
    environment:
      # Chromium writes its profile and crash database under HOME, and the
      # image's home folder is on the read-only root.
      HOME: /tmp
    networks:
      - pdf
    read_only: true
    tmpfs:
      # The files of each request and Chromium's profile; a report request
      # is about 5 MB. It counts against mem_limit.
      - /tmp:size=256m
    # Chromium on a page too large for it is killed inside this limit, and
    # the conversion fails, instead of the host killing another service.
    # 3,000 plain table rows peaked at 525 MB (decision 0043); a report
    # filled to its caps (100 rows in each section, 50 places an entry)
    # peaked at 480-582 MiB (decision 0042).
    mem_limit: 1g
    # Equal to mem_limit, so the container gets no swap. Without it Docker
    # allows as much swap again as mem_limit on a host that has swap, and
    # Chromium slows down on a page too large for it instead of being
    # killed inside the limit (decision 0092).
    memswap_limit: 1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The same converter for the integration tests, started only with
  # --profile test. It is on the network "test", not on "pdf", because the
  # tests reach it from the host through the published port, which an
  # internal network cannot carry.
  pdf-test:
    <<: *pdf
    profiles: ["test"]
    networks:
      - test
    ports:
      - "127.0.0.1:13000:3000"
    restart: "no"

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        VERSION: compose-dev
    environment:
      WEB_ADDR: ":8080"
      WEB_BASE_URL: http://localhost:8080
      VALKEY_ADDR: valkey:6379
      VALKEY_USERNAME: se-web
      VALKEY_PASSWORD_FILE: /run/secrets/valkey/password
      VALKEY_CA_FILE: /run/secrets/valkey/ca.crt
      DATABASE_URL: postgres://se_app:dev-only-se-app-password@postgres:5432/secret_externalizer # local development only
      OIDC_ISSUER_URL: http://localhost:8081/realms/secret-externalizer
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/secret-externalizer
      OIDC_CLIENT_ID: secret-externalizer-web
      OIDC_CLIENT_SECRET: dev-only-web-client-secret # local development only; matches realm.json
      # Web reads an original only when an admin asks to reveal one.
      BAO_ADDR: https://openbao:8200
      BAO_CA_FILE: /run/secrets/openbao/ca.crt
      BAO_ROLE_ID: se-web
      BAO_SECRET_ID_FILE: /run/secrets/openbao/secret-id
      PDF_URL: http://pdf:3000
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Only web's own directory of the openbao-secrets volume: its secret-id
      # and the CA, not OpenBao's private key or another role's secret-id.
      - type: volume
        source: openbao-secrets
        target: /run/secrets/openbao
        read_only: true
        volume:
          subpath: web
      # Only web's own directory of the valkey-secrets volume: its password
      # and the CA, not valkey's private key.
      - type: volume
        source: valkey-secrets
        target: /run/secrets/valkey
        read_only: true
        volume:
          subpath: web
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    # edge for the host port, postgres, and keycloak; valkey for valkey;
    # bao for OpenBao; pdf for the converter.
    networks:
      - edge
      - valkey
      - bao
      - pdf
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Started, not healthy: openbao starts only after openbao-secrets has
      # written web's secret-id, and web starts and serves every other page
      # while OpenBao is not ready.
      openbao:
        condition: service_started
      # Started, not healthy: web serves every page but the PDF export
      # while the converter is not ready.
      pdf:
        condition: service_started

  # Runs only scans, and with them the scanners. It gets only the read-only
  # mount of the workspace, so neither it nor a scanner it runs can change
  # a project's files; see decision 0068.
  worker:
    build:
      context: .
      dockerfile: deploy/worker/Dockerfile
      args:
        VERSION: compose-dev
    image: secret-externalizer-worker:compose-dev
    environment:
      WORKER_JOBS: scan
      DATABASE_URL: postgres://se_app:dev-only-se-app-password@postgres:5432/secret_externalizer # local development only
      WORKSPACE_ROOT: /workspace
      BAO_ADDR: https://openbao:8200
      BAO_CA_FILE: /run/secrets/openbao/ca.crt
      BAO_ROLE_ID: se-worker
      BAO_SECRET_ID_FILE: /run/secrets/openbao/secret-id
      # The scanners and rules the worker image holds.
      BETTERLEAKS_BIN: /usr/local/bin/betterleaks
      OPENGREP_BIN: /usr/local/bin/opengrep
      RULES_DIR: /rules
      # On the /tmp tmpfs: the scanners' home and temporary folders and the
      # UTF-8 copies of a scan's EUC-KR files, removed when the scan ends.
      SCAN_TEMP_DIR: /tmp/scan
    volumes:
      - ${SE_WORKSPACE:?set SE_WORKSPACE to the folder that holds the projects to scan, for example SE_WORKSPACE=$$HOME/work docker compose up}:/workspace:ro
      # Only the worker role's directory of the openbao-secrets volume: its
      # secret-id and the CA, not OpenBao's private key or another role's
      # secret-id. The scanners can read this secret-id, so the worker
      # policy reaches no externalized value.
      - type: volume
        source: openbao-secrets
        target: /run/secrets/openbao
        read_only: true
        volume:
          subpath: worker
    # The user must be able to read the workspace. On a Linux host, set
    # SE_UID=$(id -u) SE_GID=$(id -g).
    user: &worker-user "${SE_UID:-65532}:${SE_GID:-65532}"
    read_only: true
    tmpfs:
      # Holds the UTF-8 copies of the EUC-KR files of the scan that is
      # running, so it must fit those; it counts against the host's memory.
      - /tmp:size=1g
    cap_drop: &worker-caps
      - ALL
    security_opt: &worker-security
      - no-new-privileges:true
    stop_grace_period: 15s
    # Internal networks only: the worker and the scanners reach postgres
    # and OpenBao and nothing else.
    networks: &worker-networks
      - db
      - bao
    # A worker that stopped takes up its jobs again once their leases end.
    restart: unless-stopped
    depends_on: &worker-depends
      postgres:
        condition: service_healthy
      openbao-roles:
        condition: service_completed_successfully

  # Runs only apply checks and applies, from the same image as the worker
  # but without running any scanner. It is the only service with the
  # read-write mount of the workspace, and it changes files only while it
  # carries out an apply the user confirmed. The confirmation scan after an
  # apply is a scan, so the worker runs it.
  applier:
    # The worker's build makes this image; it is never pulled.
    image: secret-externalizer-worker:compose-dev
    pull_policy: never
    environment:
      WORKER_JOBS: apply
      DATABASE_URL: postgres://se_app:dev-only-se-app-password@postgres:5432/secret_externalizer # local development only
      APPLY_WORKSPACE_ROOT: /workspace-rw
      BAO_ADDR: https://openbao:8200
      BAO_CA_FILE: /run/secrets/openbao/ca.crt
      BAO_ROLE_ID: se-applier
      BAO_SECRET_ID_FILE: /run/secrets/openbao/secret-id
    volumes:
      - ${SE_WORKSPACE:?set SE_WORKSPACE to the folder that holds the projects to scan, for example SE_WORKSPACE=$$HOME/work docker compose up}:/workspace-rw
      # Only the applier role's directory of the openbao-secrets volume.
      - type: volume
        source: openbao-secrets
        target: /run/secrets/openbao
        read_only: true
        volume:
          subpath: applier
    # Files an apply writes belong to this user, so on a Linux host
    # SE_UID and SE_GID should be the owner of the workspace.
    user: *worker-user
    read_only: true
    cap_drop: *worker-caps
    security_opt: *worker-security
    stop_grace_period: 15s
    networks: *worker-networks
    restart: unless-stopped
    depends_on: *worker-depends

networks:
  # Carries the published ports of web, keycloak, and postgres, and
  # the connections among them. A published port needs a network that is not
  # internal, so this one is a bridge with NAT turned off: its members answer
  # on their host ports but cannot open a connection outside the host's
  # container network. Docker's DNS still answers outside names on it.
  edge:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # The worker and the applier to postgres.
  db:
    internal: true
  # Web to valkey.
  valkey:
    internal: true
  # Web, the worker, and the applier to OpenBao.
  bao:
    internal: true
  # Has no route out of the host's container network: only web and pdf are
  # on it.
  pdf:
    internal: true
  # The published ports of valkey-test, openbao-test, and pdf-test (profile
  # "test"), with NAT turned off as on edge.
  test:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  postgres-data:
  valkey-secrets:
  openbao-data:
  openbao-secrets:

secrets:
  # OpenBao's unseal key, made on the host by `make openbao-host-files`.
  openbao-unseal-key:
    file: ${OPENBAO_UNSEAL_KEY_FILE:-${HOME}/.config/secret-externalizer/openbao-unseal.key}
  # The secret-id of OpenBao's admin role, made on the host by
  # `make openbao-host-files`.
  openbao-admin-secret-id:
    file: ${OPENBAO_ADMIN_SECRET_ID_FILE:-${HOME}/.config/secret-externalizer/openbao-admin.secret-id}
